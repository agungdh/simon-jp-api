name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build -o dist/simon-jp-api ./cmd/api
      - run: go build -o dist/simon-jp-worker ./cmd/worker
      - run: go build -o dist/simon-jp-scheduler ./cmd/scheduler
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: mkdir -p dist
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o dist/simon-jp-api ./cmd/api
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o dist/simon-jp-worker ./cmd/worker
      - run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o dist/simon-jp-scheduler ./cmd/scheduler
      - uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
