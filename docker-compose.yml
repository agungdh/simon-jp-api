services:
  postgres:
    image: postgres:18
    container_name: simonjp-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: simonjp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:latest
    container_name: simonjp-valkey
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: simonjp-rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: simonjp-redis-commander
    restart: always
    environment:
      REDIS_HOSTS: "local:valkey:6379"
    ports:
      - "127.0.0.1:8084:8081"
    depends_on:
      - valkey

  adminer:
    image: adminer:latest
    container_name: simonjp-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: admin
      ADMINER_DEFAULT_DB: simonjp
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
